<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduEarn Pro - Smart LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --secondary: #10b981; --bg: #f8fafc; --white: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        nav { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--white); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }
        .hidden { display: none; }
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 3000; display: flex; align-items: center; justify-content: center; color: white; }
        .auth-card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 id="auth-title">স্বাগতম!</h2>
            <p id="auth-msg">EduEarn Pro-তে লগইন করুন</p>
            <input type="text" id="userName" placeholder="আপনার নাম">
            <input type="password" id="userPass" placeholder="পাসওয়ার্ড">
            <button class="btn" onclick="handleAuth()">প্রবেশ করুন</button>
            <p style="text-align:center; font-size:12px; margin-top:10px; cursor:pointer;" onclick="toggleAuth()">একাউন্ট নেই? রেজিস্ট্রেশন করুন</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <nav>
            <div style="font-size: 22px; font-weight: 800; color: var(--primary);">EduEarn</div>
            <div style="display: flex; gap: 20px; font-size: 20px;">
                <i class="fas fa-home" onclick="showPage('home')"></i>
                <i class="fas fa-brain" onclick="showPage('quiz')"></i>
                <i class="fas fa-user-circle" onclick="showPage('profile')"></i>
            </div>
        </nav>

        <div class="container">
            <div id="home-page">
                <div class="card">
                    <h3 id="welcome-user">হ্যালো!</h3>
                    <textarea id="postText" placeholder="নতুন কি শিখলেন?"></textarea>
                    <button class="btn" onclick="addPost()">পোস্ট করুন</button>
                </div>
                <div id="main-feed"></div>
            </div>

            <div id="quiz-page" class="hidden">
                <div class="card" style="text-align: center;">
                    <h3>🧠 কুইজ চ্যালেঞ্জ</h3>
                    <p id="qText">১+১ কত?</p>
                    <button class="btn" onclick="answer(true)">২</button>
                    <p id="qMsg" style="margin-top:10px;"></p>
                </div>
            </div>

            <div id="profile-page" class="hidden">
                <div class="card" style="text-align:center;">
                    <h2 id="profile-name">ইউজার নাম</h2>
                    <h1 style="color:var(--secondary)">৳ <span id="wallet">০</span></h1>
                    <button class="btn" onclick="logout()" style="background:#ef4444;">লগআউট</button>
                    <p onclick="openAdmin()" style="margin-top:20px; opacity:0.3; cursor:pointer; font-size:10px;">Admin</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        let currentUser = localStorage.getItem('user');
        let balance = parseInt(localStorage.getItem('balance')) || 0;

        // চেক যদি ইউজার অলরেডি লগইন থাকে
        if(currentUser) {
            startApp(currentUser);
        }

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "স্বাগতম!" : "নতুন একাউন্ট";
            document.getElementById('auth-msg').innerText = isLogin ? "লগইন করুন" : "তথ্য দিয়ে ফর্মটি পূরণ করুন";
        }

        function handleAuth() {
            const name = document.getElementById('userName').value;
            const pass = document.getElementById('userPass').value;
            if(!name || !pass) return alert("সব ঘর পূরণ করুন!");
            
            localStorage.setItem('user', name);
            startApp(name);
        }

        function startApp(name) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `হ্যালো, ${name}! 👋`;
            document.getElementById('profile-name').innerText = name;
            document.getElementById('wallet').innerText = balance;
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        function showPage(id) {
            ['home-page', 'quiz-page', 'profile-page'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(id + '-page').classList.remove('hidden');
        }

        function answer(correct) {
            if(correct) {
                balance += 5;
                localStorage.setItem('balance', balance);
                document.getElementById('wallet').innerText = balance;
                document.getElementById('qMsg').innerHTML = "✅ ৫ টাকা পেয়েছেন!";
            }
        }

        function openAdmin() {
            if(prompt("Admin Pass?") === "1234") alert("Admin Access Granted");
        }

        function addPost() {
            const text = document.getElementById('postText').value;
            if(!text) return;
            const post = `<div class="card"><b>${localStorage.getItem('user')}:</b><p>${text}</p></div>`;
            document.getElementById('main-feed').insertAdjacentHTML('afterbegin', post);
            document.getElementById('postText').value = "";
        }
    </script>
</body>
</html>
